<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111018"><title>Koshachi Ai</title>
<style>
:root{color-scheme:dark;--bg:#111018;--panel:#1b1924;--line:#302b3b;--accent:#b58cff;--muted:#aaa3b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1fa;font:15px system-ui,-apple-system,sans-serif}header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0;color:#d7baff}main{max-width:900px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,button{background:#292536;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}.tabs button.active,.primary{background:var(--accent);color:#17111f;border:0;font-weight:700}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.muted{color:var(--muted)}input,textarea,select{width:100%;background:#12101a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin:6px 0 12px}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.list button{display:block;width:100%;text-align:left;margin:7px 0}.messages{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:12px 0}.msg{max-width:88%;padding:12px 14px;border-radius:14px;background:#292536;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#493765}.msg.assistant{align-self:flex-start}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:12px}header{padding:14px}.messages{height:48vh}.row{flex-direction:column}}
</style></head><body>
<header><h1>🐾 Koshachi Ai</h1><span class="small">AI roleplay</span></header>
<main><div class="tabs"><button id="tabChats" class="active" onclick="showTab('chats')">Чаты</button><button id="tabChars" onclick="showTab('chars')">Персонажи</button></div>
<section id="chats"><div class="panel"><div class="row"><input id="chatTitle" placeholder="Название новой ролки"><button class="primary" onclick="newChat()">Создать чат</button></div><label class="small">Персонаж для чата</label><select id="chatChar"></select></div><div id="chatList" class="list"></div>
<div id="room" class="panel hidden"><div class="row"><strong id="roomTitle">Чат</strong><button onclick="closeChat()">Назад</button></div><div id="messages" class="messages"></div><textarea id="messageInput" placeholder="Напиши сообщение..."></textarea><button class="primary" style="width:100%" onclick="sendMessage()">Отправить</button></div></section>
<section id="chars" class="hidden"><div class="panel"><h3>Создать персонажа</h3><input id="charName" placeholder="Имя персонажа"><textarea id="charDesc" placeholder="Внешность, история, особенности"></textarea><textarea id="charPrompt" placeholder="Характер, манера речи, правила поведения"></textarea><button class="primary" onclick="createCharacter()">Сохранить персонажа</button></div><div id="charList" class="list"></div></section>
<p class="small">Сохраняй важные детали в описании и характере персонажа. Сервис находится в тестовой версии.</p></main>
<script>
let characters=[],chats=[],activeChat=null;
async function api(url,opts={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});let d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}
function showTab(t){document.getElementById("chats").classList.toggle("hidden",t!=="chats");document.getElementById("chars").classList.toggle("hidden",t!=="chars");document.getElementById("tabChats").classList.toggle("active",t==="chats");document.getElementById("tabChars").classList.toggle("active",t==="chars")}
async function refresh(){try{characters=await api("/api/characters");chats=await api("/api/chats");render()}catch(e){alert(e.message)}}
function render(){charList.innerHTML=characters.map(c=>`<div class="panel"><b>${esc(c.name)}</b><p class="muted">${esc(c.description||"")}</p></div>`).join("")||'<p class="muted">Пока нет персонажей.</p>';chatChar.innerHTML=characters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");chatList.innerHTML=chats.map(c=>`<button onclick="openChat(${c.id})">${esc(c.title)}</button>`).join("")||'<p class="muted">Создай первый чат.</p>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function createCharacter(){try{await api("/api/characters",{method:"POST",body:JSON.stringify({name:charName.value,description:charDesc.value,system_prompt:charPrompt.value})});charName.value=charDesc.value=charPrompt.value="";await refresh();alert("Персонаж сохранён")}catch(e){alert(e.message)}}
async function newChat(){try{let ids=chatChar.value?[Number(chatChar.value)]:[];let c=await api("/api/chats",{method:"POST",body:JSON.stringify({title:chatTitle.value||"Новая ролка",character_ids:ids})});chatTitle.value="";await refresh();openChat(c.id)}catch(e){alert(e.message)}}
async function openChat(id){activeChat=id;let c=chats.find(x=>x.id===id);roomTitle.textContent=c?.title||"Чат";room.classList.remove("hidden");await loadMessages()}
function closeChat(){room.classList.add("hidden");activeChat=null}
async function loadMessages(){let ms=await api(`/api/chats/${activeChat}/messages`);messages.innerHTML=ms.map(m=>`<div class="msg ${m.role}">${esc(m.content)}</div>`).join("");messages.scrollTop=messages.scrollHeight}
async function sendMessage(){let content=messageInput.value.trim();if(!content||!activeChat)return;messageInput.value="";let b=document.querySelector("#room .primary");b.disabled=true;b.textContent="ИИ отвечает...";try{await api(`/api/chats/${activeChat}/messages`,{method:"POST",body:JSON.stringify({content})});await loadMessages()}catch(e){alert(e.message);messageInput.value=content}finally{b.disabled=false;b.textContent="Отправить"}}
refresh();
</script></body></html>
